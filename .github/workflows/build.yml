name: Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'src/**'
      - 'config.json'
      - 'index.html'
      - 'settings.html'
      - 'styles.css'
      - 'install.sh'
      - 'install.ps1'
      - 'README.md'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/**'
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Changed areas
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.detect.outputs.code }}
      windows_macos: ${{ steps.detect.outputs.windows_macos }}
      systemd: ${{ steps.detect.outputs.systemd }}
      abi: ${{ steps.detect.outputs.abi }}
      documentation: ${{ steps.detect.outputs.documentation }}
      distribution: ${{ steps.detect.outputs.distribution }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changes
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          code=false; windows_macos=false; systemd=false; abi=false; documentation=false; distribution=false
          if [[ "$EVENT" == 'workflow_dispatch' ]]; then
            code=true; windows_macos=true; systemd=true; abi=true; documentation=true; distribution=true
          elif [[ "$EVENT" == 'schedule' ]]; then
            distribution=true
          else
            if [[ "$EVENT" == 'pull_request' ]]; then
              changed="$(git diff --name-only HEAD^1 HEAD)"
            elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              changed="$(git ls-files)"
            else
              changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            fi
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              case "$file" in
                README.md|docs/*) documentation=true ;;
                *) code=true ;;
              esac
              case "$file" in
                crates/*|Cargo.toml|Cargo.lock|install.sh|install.ps1|.github/workflows/build.yml) windows_macos=true ;;
              esac
              case "$file" in
                crates/installer/*|crates/core/*|crates/platform/src/linux.rs|Cargo.toml|Cargo.lock|install.sh|.github/workflows/build.yml) systemd=true ;;
              esac
              case "$file" in
                Cargo.toml|Cargo.lock|crates/*/Cargo.toml|crates/audio/src/capture.rs|crates/audio/src/device.rs|crates/platform/*|scripts/ci-build-glibc.sh|.github/workflows/build.yml) abi=true ;;
              esac
              case "$file" in
                README.md|docs/*) ;;
                *) if [[ "$EVENT" == 'push' ]]; then distribution=true; fi ;;
              esac
              if [[ "$file" == .github/workflows/build.yml ]]; then documentation=true; fi
            done <<< "$changed"
          fi
          {
            printf 'code=%s\n' "$code"
            printf 'windows_macos=%s\n' "$windows_macos"
            printf 'systemd=%s\n' "$systemd"
            printf 'abi=%s\n' "$abi"
            printf 'documentation=%s\n' "$documentation"
            printf 'distribution=%s\n' "$distribution"
          } >> "$GITHUB_OUTPUT"
  test:
    needs: scope
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Install system dependencies
        if: needs.scope.outputs.code == 'true'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libpulse-dev shellcheck
      - uses: dtolnay/rust-toolchain@stable
        if: needs.scope.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - if: needs.scope.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.scope.outputs.code == 'true'
        run: cargo fmt --all -- --check
      - if: needs.scope.outputs.code == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - if: needs.scope.outputs.code == 'true'
        run: cargo test --locked --workspace --all-targets
      - name: CPAL PulseAudio output monitor smoke test
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=soloist_ci
          pactl set-default-sink soloist_ci
          pactl list short sources | grep -F 'soloist_ci.monitor'
          SOLOIST_DISPLAY_MONITOR=soloist_ci.monitor \
          SOLOIST_DISPLAY_CPAL_MONITOR_SMOKE=1 \
            cargo test --locked -p soloist-display-audio pulseaudio_null_sink_monitor_captures_audio -- --nocapture
          cargo build --locked -p soloist-display-audio
          ldd target/debug/soloist-audio-bridge | tee /tmp/cpal-runtime-libraries.txt
          ! grep -q 'not found' /tmp/cpal-runtime-libraries.txt
      - name: Shell checks
        if: needs.scope.outputs.code == 'true'
        run: |
          sh -n install.sh
          shellcheck install.sh
          sh -n scripts/test-bootstrap-e2e.sh
          sh -n scripts/test-release-lifecycle.sh
      - name: Frontend syntax
        if: needs.scope.outputs.code == 'true'
        run: |
          for file in src/*.js; do node --check --input-type=module < "$file"; done
          node --experimental-default-type=module --test scripts/test-standby.mjs
          node --experimental-default-type=module --test scripts/test-landing-preview.mjs
          node --experimental-default-type=module --test scripts/test-backdrop-colour.mjs
          node --experimental-default-type=module --test scripts/test-backdrop-integration.mjs
          cargo run --locked --quiet -p soloist-display-installer --bin release-tools -- check-settings .
      - name: Release bootstrap pin smoke test
        if: needs.scope.outputs.code == 'true'
        run: |
          mkdir -p /tmp/bootstrap-test
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf; do
            case "$target" in
              x86_64-*) legacy=x86_64-unknown-linux-musl ;;
              aarch64-*) legacy=aarch64-unknown-linux-musl ;;
              armv7-*) legacy=armv7-unknown-linux-musleabihf ;;
            esac
            digest=$(printf '%s' "$target" | sha256sum | cut -d' ' -f1)
            for alias in "$target" "$legacy"; do
              printf '%s %s https://github.com/jedrek0429/soloist-display/releases/download/v0.0.0/soloist-display-%s\n' "$alias" "$digest" "$target"
            done
          done > /tmp/bootstrap-test/bootstrap-manifest.txt
          cargo run --locked --quiet -p soloist-display-installer --bin release-tools -- render-bootstrap install.sh /tmp/bootstrap-test/bootstrap-manifest.txt https://github.com/jedrek0429/soloist-display/releases/download/v0.0.0 > /tmp/bootstrap-test/install.sh
          sh -n /tmp/bootstrap-test/install.sh
          shellcheck /tmp/bootstrap-test/install.sh
          grep -Fq "PIN_RELEASE_BASE='https://github.com/jedrek0429/soloist-display/releases/download/v0.0.0'" /tmp/bootstrap-test/install.sh
          ! grep -q '@SOLOIST_DISPLAY_' /tmp/bootstrap-test/install.sh
          sh scripts/test-bootstrap-e2e.sh
      - name: CLI smoke test
        if: needs.scope.outputs.code == 'true'
        run: |
          cargo build --locked --workspace
          target/debug/soloist-display --help
          target/debug/soloist-display --version
          if HOME=/tmp SOLOIST_DISPLAY_TEST_ROOT=/tmp/soloist-display-no-tty \
            target/debug/soloist-display install </dev/null >/tmp/no-tty.log 2>&1; then exit 1; fi
          grep -q 'non-interactive installation requires --yes' /tmp/no-tty.log

          mkdir -p /tmp/soloist-display-probe/bin /tmp/soloist-display-probe/home
          printf '%s\n' '#!/bin/sh' \
            'if [ "$1" = --user ] && [ "$2" = show-environment ]; then' \
            '  echo SECRET_TEST_VALUE=must-not-leak' \
            '  exit 0' \
            'fi' \
            'exit 1' > /tmp/soloist-display-probe/bin/systemctl
          chmod 755 /tmp/soloist-display-probe/bin/systemctl
          if HOME=/tmp/soloist-display-probe/home PATH="/tmp/soloist-display-probe/bin:$PATH" \
            target/debug/soloist-display install </dev/null >/tmp/soloist-display-probe/output 2>&1; then
            echo 'Expected non-interactive installation to fail' >&2
            exit 1
          fi
          grep -Fq 'non-interactive installation requires --yes' /tmp/soloist-display-probe/output
          ! grep -Fq 'SECRET_TEST_VALUE' /tmp/soloist-display-probe/output
  cross-build:
    needs: scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scope.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: glibc-${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@cargo-zigbuild
      - run: bash scripts/ci-build-glibc.sh ${{ matrix.target }}
  documentation:
    needs: scope
    if: needs.scope.outputs.documentation == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Relative assets exist
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class Images(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []

              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      self.sources.extend(value for key, value in attrs if key == "src" and value)

          readme = Path("README.md").read_text(encoding="utf-8")
          images = Images()
          images.feed(readme)
          sources = images.sources + re.findall(r'!\[[^\]]*\]\(([^\s)]+)', readme)
          if not sources:
              raise SystemExit("README has no screenshots")

          for source in sources:
              if source.startswith(("https://", "http://", "data:")):
                  continue
              if not Path(source).is_file():
                  raise SystemExit(f"Missing README image: {source}")
          PY
          test -f docs/installer.md
          test -f docs/releasing.md
      - name: External documentation resolves
        run: |
          curl --fail --location --silent --show-error --retry 3 --output /dev/null \
            https://developer.spotify.com/documentation/soloist
          curl --fail --location --silent --show-error --retry 3 --output /dev/null \
            https://developer.spotify.com/dashboard/soloist
  systemd-integration:
    needs: scope
    if: needs.scope.outputs.systemd == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start systemd user manager
        run: |
          sudo loginctl enable-linger "$(whoami)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Test generated Soloist service with live systemd
        env:
          SOLOIST_DISPLAY_RUN_SYSTEMD_TEST: '1'
        run: cargo test --locked -p soloist-display-installer generated_soloist_unit_passes_credentials_to_live_systemd -- --nocapture
      - name: Test live Soloist unit restoration
        env:
          SOLOIST_DISPLAY_RUN_SYSTEMD_TEST: '1'
        run: |
          cargo test --locked -p soloist-display-installer restores_previous_live_systemd_user_service -- --nocapture
      - name: Test optional MPRIS bridge service with live systemd
        env:
          SOLOIST_DISPLAY_RUN_SYSTEMD_TEST: '1'
        run: cargo test --locked -p soloist-display-installer live_mpris_unit_can_start_independently -- --nocapture
      - name: Test live uninstall and original service restoration
        env:
          SOLOIST_DISPLAY_RUN_SYSTEMD_TEST: '1'
        run: cargo test --locked -p soloist-display-installer live_uninstall_restores_original_service -- --nocapture
  linux-abi:
    needs: scope
    if: needs.scope.outputs.abi == 'true' && github.event_name != 'schedule'
    # Native x86 on relevant PRs; native ARM64 is only built manually.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}]' || '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: glibc-${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@cargo-zigbuild
      - run: bash scripts/ci-build-glibc.sh ${{ matrix.target }}

  linux-abi-armv7:
    needs: scope
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: glibc-armv7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@cargo-zigbuild
      - run: bash scripts/ci-build-glibc.sh armv7-unknown-linux-gnueabihf
  windows-macos:
    needs: scope
    if: needs.scope.outputs.windows_macos == 'true' && github.event_name != 'schedule'
    name: Windows/macOS (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: windows
            runner: windows-2025
          - system: macos
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.system }}
      - name: Verify Apple Silicon runner
        if: matrix.system == 'macos'
        run: test "$(uname -m)" = arm64
      - name: Compile platform-specific Rust
        run: cargo check --locked -p soloist-display-audio
      - name: Validate Windows bootstrap syntax
        if: matrix.system == 'windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Validate macOS bootstrap syntax
        if: matrix.system == 'macos'
        run: sh -n install.sh
      - name: Test Windows/macOS audio runtime
        run: cargo test --locked -p soloist-display-audio
      - name: Test Windows/macOS installer library
        run: cargo test --locked -p soloist-display-installer --lib
  distribution-build:
    needs: scope
    if: needs.scope.outputs.distribution == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - run: cargo zigbuild --release --locked -p soloist-display-installer --target x86_64-unknown-linux-gnu.2.38
      - uses: actions/upload-artifact@v7
        with:
          name: manager-x86_64
          path: target/x86_64-unknown-linux-gnu/release/soloist-display
          if-no-files-found: error
  distribution:
    name: CLI (${{ matrix.image }})
    needs: distribution-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            install: pacman -Syu --noconfirm ca-certificates
            expected: Arch
          - image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
            expected: Ubuntu
          - image: debian:stable
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
            expected: Debian
          - image: fedora:latest
            install: dnf install -y ca-certificates
            expected: Fedora
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install trust store
        run: ${{ matrix.install }}
      - uses: actions/download-artifact@v8
        with:
          name: manager-x86_64
          path: /tmp/soloist-display-bin
      - name: Exercise production manager
        run: |
          chmod +x /tmp/soloist-display-bin/soloist-display
          /tmp/soloist-display-bin/soloist-display --version
          /tmp/soloist-display-bin/soloist-display --help
          if /tmp/soloist-display-bin/soloist-display doctor >/tmp/doctor.log 2>&1; then exit 1; fi
          grep -q 'Installation metadata' /tmp/doctor.log
          if HOME=/tmp/home SOLOIST_DISPLAY_TEST_ROOT=/tmp/test-root \
            /tmp/soloist-display-bin/soloist-display install </dev/null >/tmp/no-tty.log 2>&1; then
            echo 'Installation accepted missing --yes' >&2
            exit 1
          fi
          grep -Fq 'non-interactive installation requires --yes' /tmp/no-tty.log
          if HOME=/tmp/home SOLOIST_DISPLAY_TEST_ROOT=/tmp/test-root \
            SOLOIST_DISPLAY_FAULT=package_install \
            /tmp/soloist-display-bin/soloist-display install --yes >/tmp/install.log 2>&1; then
            echo 'Injected installer failure was ignored' >&2
            exit 1
          fi
          grep -Fq 'injected package installation failure' /tmp/install.log
          grep -Fq 'Soloist Display · ${{ matrix.expected }} / X86_64' /tmp/install.log
          test ! -f /tmp/test-root/state/soloist-display/install.json
