name: Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'audio-bridge/**'
      - 'installer/**'
      - 'src/**'
      - 'config.json'
      - 'index.html'
      - 'settings.html'
      - 'styles.css'
      - 'install.sh'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'audio-bridge/**'
      - 'installer/**'
      - 'src/**'
      - 'config.json'
      - 'index.html'
      - 'settings.html'
      - 'styles.css'
      - 'install.sh'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/build.yml'
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: CPAL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CPAL PulseAudio output monitor smoke test
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/cpal-system-loopback'
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=soloist_ci
          pactl set-default-sink soloist_ci
          pactl list short sources | grep -F 'soloist_ci.monitor'
          SOLOIST_DISPLAY_MONITOR=soloist_ci.monitor \
          SOLOIST_DISPLAY_CPAL_MONITOR_SMOKE=1 \
            cargo test --locked -p soloist-audio-bridge pulseaudio_null_sink_monitor_captures_audio -- --nocapture
          cargo build --locked -p soloist-audio-bridge
          ldd target/debug/soloist-audio-bridge | tee /tmp/cpal-runtime-libraries.txt
          ! grep -q 'not found' /tmp/cpal-runtime-libraries.txt
      - name: Shell checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sh -n install.sh
          shellcheck install.sh
          sh -n scripts/test-bootstrap-e2e.sh
          sh -n scripts/test-release-lifecycle.sh
      - name: Frontend syntax
        run: |
          for file in src/*.js; do node --check --input-type=module < "$file"; done
          node --experimental-default-type=module --test scripts/test-standby.mjs
          node --experimental-default-type=module --test scripts/test-landing-preview.mjs
          cargo run --quiet -p soloist-display-installer --bin release-tools -- check-settings .
      - name: Release bootstrap pin smoke test
        run: |
          mkdir -p /tmp/bootstrap-test
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf; do
            case "$target" in
              x86_64-*) legacy=x86_64-unknown-linux-musl ;;
              aarch64-*) legacy=aarch64-unknown-linux-musl ;;
              armv7-*) legacy=armv7-unknown-linux-musleabihf ;;
            esac
            digest=$(printf '%s' "$target" | sha256sum | cut -d' ' -f1)
            for alias in "$target" "$legacy"; do
              printf '%s %s https://github.com/jedrek0429/soloist-display/releases/download/v0.0.0/soloist-display-%s\n' "$alias" "$digest" "$target"
            done
          done > /tmp/bootstrap-test/bootstrap-manifest.txt
          cargo run --quiet -p soloist-display-installer --bin release-tools -- render-bootstrap install.sh /tmp/bootstrap-test/bootstrap-manifest.txt https://github.com/jedrek0429/soloist-display/releases/download/v0.0.0 > /tmp/bootstrap-test/install.sh
          sh -n /tmp/bootstrap-test/install.sh
          shellcheck /tmp/bootstrap-test/install.sh
          grep -Fq "PIN_RELEASE_BASE='https://github.com/jedrek0429/soloist-display/releases/download/v0.0.0'" /tmp/bootstrap-test/install.sh
          ! grep -q '@SOLOIST_DISPLAY_' /tmp/bootstrap-test/install.sh
          sh scripts/test-bootstrap-e2e.sh
      - name: CLI smoke test
        run: |
          cargo build --workspace
          target/debug/soloist-display --help
          target/debug/soloist-display --version
          if HOME=/tmp SOLOIST_DISPLAY_TEST_ROOT=/tmp/soloist-display-no-tty \
            target/debug/soloist-display install </dev/null >/tmp/no-tty.log 2>&1; then exit 1; fi
          grep -q 'non-interactive installation requires --yes' /tmp/no-tty.log

          mkdir -p /tmp/soloist-display-probe/bin /tmp/soloist-display-probe/home
          printf '%s\n' '#!/bin/sh' \
            'if [ "$1" = --user ] && [ "$2" = show-environment ]; then' \
            '  echo SECRET_TEST_VALUE=must-not-leak' \
            '  exit 0' \
            'fi' \
            'exit 1' > /tmp/soloist-display-probe/bin/systemctl
          chmod 755 /tmp/soloist-display-probe/bin/systemctl
          if HOME=/tmp/soloist-display-probe/home PATH="/tmp/soloist-display-probe/bin:$PATH" \
            target/debug/soloist-display install </dev/null >/tmp/soloist-display-probe/output 2>&1; then
            echo 'Expected non-interactive installation to fail' >&2
            exit 1
          fi
          grep -Fq 'non-interactive installation requires --yes' /tmp/soloist-display-probe/output
          ! grep -Fq 'SECRET_TEST_VALUE' /tmp/soloist-display-probe/output
  cross-build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: glibc-${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@cargo-zigbuild
      - run: bash scripts/ci-build-glibc.sh ${{ matrix.target }}
