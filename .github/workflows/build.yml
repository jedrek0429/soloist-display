name: Checks
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'audio-bridge/**'
      - 'installer/**'
      - 'src/**'
      - 'config.json'
      - 'index.html'
      - 'settings.html'
      - 'styles.css'
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'audio-bridge/**'
      - 'installer/**'
      - 'src/**'
      - 'config.json'
      - 'index.html'
      - 'settings.html'
      - 'styles.css'
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/**'
      - '.github/workflows/build.yml'
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Shell checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sh -n install.sh
          shellcheck install.sh
      - name: PowerShell bootstrap syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Frontend syntax
        run: |
          for file in src/*.js; do node --check --input-type=module < "$file"; done
          python -m json.tool config.json >/dev/null
      - name: Release tooling tests
        run: python3 scripts/test-release-tools.py
      - name: CLI smoke test
        run: |
          cargo build --workspace
          target/debug/soloist-display --help
          target/debug/soloist-display --version
          if HOME=/tmp SOLOIST_DISPLAY_TEST_ROOT=/tmp/soloist-display-no-tty \
            target/debug/soloist-display install </dev/null >/tmp/no-tty.log 2>&1; then exit 1; fi
          grep -q 'non-interactive installation requires --yes' /tmp/no-tty.log
  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@v2
      - uses: taiki-e/install-action@cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo zigbuild --workspace --release --target ${{ matrix.target }}
      - run: file target/${{ matrix.target }}/release/soloist-display target/${{ matrix.target }}/release/soloist-audio-bridge
      - name: Runtime smoke test (native or QEMU)
        run: |
          binary="target/${{ matrix.target }}/release/soloist-display"
          case '${{ matrix.target }}' in
            x86_64-*) "$binary" --version ;;
            aarch64-*) sudo apt-get update && sudo apt-get install -y qemu-user-static; qemu-aarch64-static "$binary" --version ;;
            armv7-*) sudo apt-get update && sudo apt-get install -y qemu-user-static; qemu-arm-static "$binary" --version ;;
          esac

  native-platforms:
    name: native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
          - name: windows-arm64
            runner: windows-11-arm
          - name: macos-arm64
            runner: macos-26
          - name: macos-x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: rustc -vV
      - run: cargo test --workspace --all-targets --locked
      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p soloist-display-installer --locked
          .\target\debug\soloist-display.exe --version
          .\target\debug\soloist-display.exe --help
          $env:SOLOIST_DISPLAY_TEST_ROOT = "$env:RUNNER_TEMP\soloist display smoke"
          .\target\debug\soloist-display.exe doctor
          if ($LASTEXITCODE -ne 1) { throw "doctor should report an absent installation" }
      - name: CLI smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build -p soloist-display-installer --locked
          target/debug/soloist-display --version
          target/debug/soloist-display --help
          if SOLOIST_DISPLAY_TEST_ROOT="$RUNNER_TEMP/soloist display smoke" \
            target/debug/soloist-display doctor; then
            echo 'doctor should report an absent installation' >&2
            exit 1
          fi
