name: Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'audio-bridge/**'
      - 'installer/**'
      - 'src/**'
      - 'config.json'
      - 'index.html'
      - 'settings.html'
      - 'styles.css'
      - 'install.sh'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'audio-bridge/**'
      - 'installer/**'
      - 'src/**'
      - 'config.json'
      - 'index.html'
      - 'settings.html'
      - 'styles.css'
      - 'install.sh'
      - 'scripts/**'
      - '.github/workflows/build.yml'
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Shell checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sh -n install.sh
          shellcheck install.sh
      - name: Frontend syntax
        run: |
          for file in src/*.js; do node --check --input-type=module < "$file"; done
          cargo run --quiet -p soloist-display-installer --bin release-tools -- check-settings .
      - name: Release bootstrap pin smoke test
        run: |
          mkdir -p /tmp/bootstrap-test
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            printf '%s %s https://github.com/jedrek0429/soloist-display/releases/download/v0.0.0/soloist-display-%s\n' "$target" "$(printf '%s' "$target" | sha256sum | cut -d' ' -f1)" "$target"
          done > /tmp/bootstrap-test/bootstrap-manifest.txt
          cargo run --quiet -p soloist-display-installer --bin release-tools -- render-bootstrap install.sh /tmp/bootstrap-test/bootstrap-manifest.txt https://github.com/jedrek0429/soloist-display/releases/download/v0.0.0 > /tmp/bootstrap-test/install.sh
          sh -n /tmp/bootstrap-test/install.sh
          shellcheck /tmp/bootstrap-test/install.sh
          grep -Fq "PIN_RELEASE_BASE='https://github.com/jedrek0429/soloist-display/releases/download/v0.0.0'" /tmp/bootstrap-test/install.sh
          ! grep -q '@SOLOIST_DISPLAY_' /tmp/bootstrap-test/install.sh
          sh scripts/test-bootstrap-e2e.sh
      - name: CLI smoke test
        run: |
          cargo build --workspace
          target/debug/soloist-display --help
          target/debug/soloist-display --version
          if HOME=/tmp SOLOIST_DISPLAY_TEST_ROOT=/tmp/soloist-display-no-tty \
            target/debug/soloist-display install </dev/null >/tmp/no-tty.log 2>&1; then exit 1; fi
          grep -q 'non-interactive installation requires --yes' /tmp/no-tty.log
  systemd-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start systemd user manager
        run: |
          sudo loginctl enable-linger "$(whoami)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Test live Soloist unit restoration
        env:
          SOLOIST_DISPLAY_RUN_SYSTEMD_TEST: '1'
        run: |
          systemctl --user show-environment
          cargo test --locked -p soloist-display-installer restores_previous_live_systemd_user_service -- --nocapture
      - name: Test live uninstall and original service restoration
        env:
          SOLOIST_DISPLAY_RUN_SYSTEMD_TEST: '1'
        run: cargo test --locked -p soloist-display-installer live_uninstall_restores_original_service -- --nocapture

  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo zigbuild --workspace --release --target ${{ matrix.target }}
      - run: file target/${{ matrix.target }}/release/soloist-display target/${{ matrix.target }}/release/soloist-audio-bridge
      - name: Runtime smoke test (native or QEMU)
        run: |
          binary="target/${{ matrix.target }}/release/soloist-display"
          case '${{ matrix.target }}' in
            x86_64-*) "$binary" --version ;;
            aarch64-*) sudo apt-get update && sudo apt-get install -y qemu-user-static; qemu-aarch64-static "$binary" --version ;;
            armv7-*) sudo apt-get update && sudo apt-get install -y qemu-user-static; qemu-arm-static "$binary" --version ;;
          esac
