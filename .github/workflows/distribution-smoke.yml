name: Distribution smoke tests
on:
  pull_request:
    paths: ['installer/**', 'install.sh', 'Cargo.toml', 'Cargo.lock', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['installer/**', 'install.sh', 'Cargo.toml', 'Cargo.lock', '.github/workflows/**']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: distro-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: goto-bus-stop/setup-zig@v2
      - uses: taiki-e/install-action@cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - run: cargo zigbuild --release --locked -p soloist-display-installer --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: manager-x86_64
          path: target/x86_64-unknown-linux-musl/release/soloist-display
          if-no-files-found: error
  distro:
    name: CLI (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            install: pacman -Syu --noconfirm ca-certificates
            expected: Arch
          - image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
            expected: Ubuntu
          - image: debian:stable
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
            expected: Debian
          - image: fedora:latest
            install: dnf install -y ca-certificates
            expected: Fedora
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install trust store
        run: ${{ matrix.install }}
      - uses: actions/download-artifact@v4
        with:
          name: manager-x86_64
          path: /tmp/soloist-display-bin
      - name: Exercise production manager
        run: |
          chmod +x /tmp/soloist-display-bin/soloist-display
          /tmp/soloist-display-bin/soloist-display --version
          /tmp/soloist-display-bin/soloist-display --help
          if /tmp/soloist-display-bin/soloist-display doctor >/tmp/doctor.log 2>&1; then exit 1; fi
          grep -q 'Installation metadata' /tmp/doctor.log
          HOME=/tmp/home SOLOIST_DISPLAY_TEST_ROOT=/tmp/test-root \
            /tmp/soloist-display-bin/soloist-display install --yes >/tmp/install.log 2>&1 || true
          grep -Fq 'Soloist Display · ${{ matrix.expected }} / X86_64' /tmp/install.log
