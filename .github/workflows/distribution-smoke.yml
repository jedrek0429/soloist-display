name: Distribution smoke tests
on:
  push:
    branches: [main, beta/cpal-integration]
    paths:
      - 'installer/**'
      - 'audio-bridge/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config.json'
      - 'install.sh'
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'installer/**'
      - 'audio-bridge/**'
      - '.github/workflows/distribution-smoke.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: distro-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.head_ref == 'feat/cpal-glibc-linux-packaging'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - run: cargo zigbuild --release --locked -p soloist-display-installer --target x86_64-unknown-linux-gnu.2.38
      - uses: actions/upload-artifact@v7
        with:
          name: manager-x86_64
          path: target/x86_64-unknown-linux-gnu/release/soloist-display
          if-no-files-found: error
  distro:
    name: CLI (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            install: pacman -Syu --noconfirm ca-certificates
            expected: Arch
          - image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
            expected: Ubuntu
          - image: debian:stable
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
            expected: Debian
          - image: fedora:latest
            install: dnf install -y ca-certificates
            expected: Fedora
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install trust store
        run: ${{ matrix.install }}
      - uses: actions/download-artifact@v8
        with:
          name: manager-x86_64
          path: /tmp/soloist-display-bin
      - name: Exercise production manager
        run: |
          chmod +x /tmp/soloist-display-bin/soloist-display
          /tmp/soloist-display-bin/soloist-display --version
          /tmp/soloist-display-bin/soloist-display --help
          if /tmp/soloist-display-bin/soloist-display doctor >/tmp/doctor.log 2>&1; then exit 1; fi
          grep -q 'Installation metadata' /tmp/doctor.log
          if HOME=/tmp/home SOLOIST_DISPLAY_TEST_ROOT=/tmp/test-root \
            /tmp/soloist-display-bin/soloist-display install </dev/null >/tmp/no-tty.log 2>&1; then
            echo 'Installation accepted missing --yes' >&2
            exit 1
          fi
          grep -Fq 'non-interactive installation requires --yes' /tmp/no-tty.log
          if HOME=/tmp/home SOLOIST_DISPLAY_TEST_ROOT=/tmp/test-root \
            SOLOIST_DISPLAY_FAULT=package_install \
            /tmp/soloist-display-bin/soloist-display install --yes >/tmp/install.log 2>&1; then
            echo 'Injected installer failure was ignored' >&2
            exit 1
          fi
          grep -Fq 'injected package installation failure' /tmp/install.log
          grep -Fq 'Soloist Display · ${{ matrix.expected }} / X86_64' /tmp/install.log
          test ! -f /tmp/test-root/state/soloist-display/install.json
