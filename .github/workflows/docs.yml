name: Documentation checks
on:
  push:
    branches: [main]
    paths: ['README.md', 'docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['README.md', 'docs/**', '.github/workflows/docs.yml']
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Relative assets exist
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class Images(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []

              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      self.sources.extend(value for key, value in attrs if key == "src" and value)

          readme = Path("README.md").read_text(encoding="utf-8")
          images = Images()
          images.feed(readme)
          sources = images.sources + re.findall(r'!\[[^\]]*\]\(([^\s)]+)', readme)
          if not sources:
              raise SystemExit("README has no screenshots")

          for source in sources:
              if source.startswith(("https://", "http://", "data:")):
                  continue
              if not Path(source).is_file():
                  raise SystemExit(f"Missing README image: {source}")
          PY
          test -f docs/installer.md
          test -f docs/releasing.md
      - name: External documentation resolves
        run: |
          curl --fail --location --silent --show-error --retry 3 --output /dev/null \
            https://developer.spotify.com/documentation/soloist
          curl --fail --location --silent --show-error --retry 3 --output /dev/null \
            https://developer.spotify.com/dashboard/soloist
