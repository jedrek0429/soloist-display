name: Publish landing page
on:
  push:
    branches: [main]
    paths: ['site/**', 'index.html', 'styles.css', 'src/motion.js', 'src/spectrum.js', 'install.sh', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare static site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages/src"
          cp site/index.html "$RUNNER_TEMP/pages/index.html"
          # Resolve the release only when publishing; the landing page needs no API calls.
          RELEASE_TAG="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [ -n "$RELEASE_TAG" ]; then
            RELEASE_TAG="$RELEASE_TAG" python3 -c 'import html, os, pathlib, urllib.parse; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"pages/index.html"; tag=os.environ["RELEASE_TAG"]; url="https://github.com/jedrek0429/soloist-display/releases/tag/"+urllib.parse.quote(tag, safe=""); markup="<a class="+chr(34)+"version"+chr(34)+" href="+chr(34)+url+chr(34)+">"+html.escape(tag)+"</a>"; p.write_text(p.read_text().replace("<!-- release-version -->", markup))'
          fi
          cp styles.css "$RUNNER_TEMP/pages/styles.css"
          cp src/motion.js src/spectrum.js "$RUNNER_TEMP/pages/src/"
          cp site/demo.js "$RUNNER_TEMP/pages/src/demo.js"
          # Bundle the album art at publish time, never fetch it during page load.
          curl --fail --location --retry 3 --silent --show-error "https://cdn-p.smehost.net/sites/c5d2b1a28fd246bfafed3b8dbafc1352/wp-content/uploads/2021/05/cover-45.jpg" -o "$RUNNER_TEMP/pages/kind-of-blue.jpg"
          # Use production display markup; replace only its live websocket entrypoint.
          sed 's@src="./src/main.js"@src="./src/demo.js"@' index.html > "$RUNNER_TEMP/pages/preview.html"
          if ! curl --fail --location --silent --show-error \
            https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh \
            -o "$RUNNER_TEMP/pages/install.sh"; then
            cp install.sh "$RUNNER_TEMP/pages/install.sh"
          fi
          touch "$RUNNER_TEMP/pages/.nojekyll"
      - name: Publish gh-pages branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git switch --track origin/gh-pages
          else
            git switch --orphan gh-pages
          fi
          cp "$RUNNER_TEMP/pages/index.html" index.html
          cp "$RUNNER_TEMP/pages/preview.html" preview.html
          cp "$RUNNER_TEMP/pages/styles.css" styles.css
          cp "$RUNNER_TEMP/pages/kind-of-blue.jpg" kind-of-blue.jpg
          mkdir -p src
          cp "$RUNNER_TEMP/pages/src/"*.js src/
          cp "$RUNNER_TEMP/pages/install.sh" install.sh
          cp "$RUNNER_TEMP/pages/.nojekyll" .nojekyll
          git add index.html preview.html kind-of-blue.jpg styles.css src/motion.js src/spectrum.js src/demo.js install.sh .nojekyll
          git commit -m "Publish Soloist Display landing page" || exit 0
          git push origin HEAD:gh-pages
