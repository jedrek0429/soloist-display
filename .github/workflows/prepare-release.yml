name: Prepare stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (e.g. 1.0.1)'
        type: string
        required: true
      target_branch:
        description: 'Source branch to promote into stable'
        type: string
        required: true
        default: main

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-stable-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate and prepare release branch
        id: release
        env:
          VERSION_INPUT: ${{ inputs.version }}
          SOURCE_BRANCH: ${{ inputs.target_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only stable MAJOR.MINOR.PATCH versions are allowed" >&2
            exit 1
          fi
          if [[ "$SOURCE_BRANCH" != main && ! "$SOURCE_BRANCH" =~ ^(alpha|beta)/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Source must be main, alpha/vX.Y.Z or beta/vX.Y.Z" >&2
            exit 1
          fi
          tag="v$version"
          branch="release/$tag"
          git fetch origin "$SOURCE_BRANCH"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "Release branch $branch already exists" >&2
            exit 1
          fi

          # First stable is bootstrapped from main. Later releases never write
          # directly to stable; they must merge an explicit release PR.
          if ! git ls-remote --exit-code --heads origin refs/heads/stable >/dev/null; then
            baseline="$(git rev-parse origin/main)"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/stable -f sha="$baseline"
          fi
          git fetch origin stable
          git switch --create "$branch" "origin/$SOURCE_BRANCH"

          # Merge the last released state to preserve stable ancestry after
          # squash merges. Stop on conflicts rather than choosing silently.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit --no-ff origin/stable || {
            echo "Source conflicts with stable. Resolve integration before releasing." >&2
            exit 1
          }
          current="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          stable_version="$(git show origin/stable:Cargo.toml | sed -n 's/^version = "\([^"]*\)"$/\1/p')"
          test -n "$current"
          test -n "$stable_version"
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- validate-tag "$tag"
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- validate-bump "$current" "$version"
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- validate-bump "$stable_version" "$version"

          VERSION="$version" python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("Cargo.toml")
          contents, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              'version = "' + os.environ["VERSION"] + '"',
              path.read_text(),
          )
          if count != 1:
              raise SystemExit("Expected one workspace version")
          path.write_text(contents)
          PY
          cargo update --workspace
          cargo metadata --format-version 1 --no-deps --locked >/dev/null
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- verify-workspace-version "$tag"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump $tag"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Open stable pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_BRANCH: ${{ inputs.target_branch }}
        run: |
          gh pr create --base stable --head "$BRANCH" \
            --title "chore: bump $TAG" \
            --body "Promote \`$SOURCE_BRANCH\` to the protected \`stable\` branch as $TAG.

          Merge this PR only after all checks pass. The merged stable commit is tagged and published by Signed release."

      - name: Run checks for token-created PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
          TOKEN_CREATED_PR: ${{ secrets.RELEASE_BOT_TOKEN == '' }}
        run: |
          if [ "$TOKEN_CREATED_PR" = true ]; then
            gh workflow run build.yml --ref "$BRANCH"
          fi
