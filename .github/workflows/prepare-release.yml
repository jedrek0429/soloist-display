name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0-beta.1)'
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [[ "$version" == *+* ]]; then
            echo "Build metadata is not supported in release tags" >&2
            exit 1
          fi
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- validate-tag "v$version"
          current="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "$current"
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- validate-bump "$current" "$version"
          tag="v$version"
          branch="release/$tag"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "Branch $branch already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Update Cargo version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          test "$(grep -c '^version = "' Cargo.toml)" -eq 1
          sed -i -E "s/^(version = \")[^\"]+(\"$)/\1${VERSION}\2/" Cargo.toml
          cargo update --workspace
          cargo metadata --format-version 1 --no-deps --locked > /dev/null
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- verify-workspace-version "v$VERSION"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump v$VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title "chore: bump v$VERSION" \
            --body "Update the workspace version and Cargo.lock to v$VERSION.

          Merging this PR tags the merged commit and starts the signed release pipeline."

      - name: Run checks if GITHUB_TOKEN created the PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
          TOKEN_CREATED_PR: ${{ secrets.RELEASE_BOT_TOKEN == '' }}
        run: |
          if [ "$TOKEN_CREATED_PR" = "true" ]; then
            gh workflow run build.yml --ref "$BRANCH"
          fi
