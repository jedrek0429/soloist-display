name: Prepare stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (e.g. 1.0.0)'
        type: string
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-stable-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Prepare versioned release commit without changing main
        id: release
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only stable MAJOR.MINOR.PATCH versions are allowed" >&2
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          git fetch origin main stable
          git switch --detach origin/main
          source_sha="$(git rev-parse HEAD)"
          current="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          stable_version="$(git show origin/stable:Cargo.toml | sed -n 's/^version = "\([^"]*\)"$/\1/p')"
          test -n "$current"
          test -n "$stable_version"
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- validate-tag "$tag"
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- validate-bump "$current" "$version"
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- validate-bump "$stable_version" "$version"
          VERSION="$version" python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("Cargo.toml")
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              'version = "' + os.environ["VERSION"] + '"',
              path.read_text(),
          )
          if count != 1:
              raise SystemExit("Expected one workspace version")
          path.write_text(updated)
          PY
          cargo update --workspace
          cargo metadata --format-version 1 --no-deps --locked >/dev/null
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- verify-workspace-version "$tag"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: build $tag from $source_sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check release tree
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for file in src/*.js; do node --check --input-type=module < "$file"; done
          node --experimental-default-type=module --test scripts/test-standby.mjs
          node --experimental-default-type=module --test scripts/test-landing-preview.mjs

      - name: Tag verified release tree
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Soloist Display $TAG"
          git push origin "refs/tags/$TAG"

      # A tag pushed with GITHUB_TOKEN does not trigger push workflows.
      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
