name: Publish prerelease on push

on:
  push:
    branches:
      - 'alpha/v*'
      - 'beta/v*'

permissions:
  contents: write
  actions: write

# Serialise version allocation across alpha and beta branches.
concurrency:
  group: prerelease-tags
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create versioned prerelease tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REF" =~ ^(alpha|beta)/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected alpha/vX.Y.Z or beta/vX.Y.Z" >&2
            exit 1
          fi
          channel="${BASH_REMATCH[1]}"
          base="${BASH_REMATCH[2]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags origin
          # Refuse outdated maintenance lines before creating a release tag.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \\
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \\
            | cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- \\
              validate-prerelease-floor "v${base}-${channel}.1"

          # This tagged, version-only commit always has the source SHA as its parent.
          # Re-running a push never increments the prerelease number.
          for tag in $(git tag -l "v${base}-${channel}.*"); do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]] &&
               [[ "$(git rev-parse "${tag}^{commit}^" 2>/dev/null || true)" == "$SOURCE_SHA" ]]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          highest=0
          for tag in $(git tag -l "v${base}-${channel}.*"); do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.([0-9]+)$ ]]; then
              n="${BASH_REMATCH[2]}"
              if (( 10#$n > highest )); then highest=$((10#$n)); fi
            fi
          done
          version="$base-$channel.$((highest + 1))"
          tag="v$version"
          git switch --detach "$SOURCE_SHA"
          VERSION="$version" python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("Cargo.toml")
          source = path.read_text()
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              'version = "' + os.environ["VERSION"] + '"',
              source,
          )
          if count != 1:
              raise SystemExit("Expected exactly one workspace version")
          path.write_text(updated)
          PY
          cargo update --workspace
          cargo metadata --format-version 1 --no-deps --locked >/dev/null
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- verify-workspace-version "$tag"
          git add Cargo.toml Cargo.lock
          git commit --allow-empty -m "chore: build $tag"
          git tag -a "$tag" -m "Soloist Display $tag (source $SOURCE_SHA)"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch signed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
