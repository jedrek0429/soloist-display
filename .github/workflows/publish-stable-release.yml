name: Publish merged stable release

on:
  pull_request:
    types: [closed]
    branches: [stable]

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-merged-stable
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      ${{ github.event.pull_request.merged == true &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'release/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify stable version and tag merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          tag="${BRANCH#release/}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable releases must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          test "$PR_TITLE" = "chore: bump $tag"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          git fetch origin stable
          git merge-base --is-ancestor "$MERGE_SHA" origin/stable
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- validate-tag "$tag"
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- verify-workspace-version "$tag"
          cargo metadata --format-version 1 --no-deps --locked >/dev/null

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$MERGE_SHA" || {
              echo "Tag $tag points to another commit" >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Soloist Display $tag" "$MERGE_SHA"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            exit 0
          fi
          gh workflow run release.yml --ref "$tag"
