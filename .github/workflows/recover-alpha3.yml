name: Recover v1.0.0-alpha.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-alpha3.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-v1.0.0-alpha.3
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the original tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v1.0.0-alpha.3
          persist-credentials: false

      - name: Verify original commit
        run: test "$(git rev-parse HEAD)" = "0e48a64ebeb085e7d444d1861ea87d693a97441b"

      - name: Restore release tool
        uses: actions/download-artifact@v8
        with:
          name: release-tools
          path: tool/
          run-id: 41743065001
          github-token: ${{ github.token }}

      - name: Restore unsigned release
        uses: actions/download-artifact@v8
        with:
          name: unsigned-release
          path: dist/
          run-id: 41743065001
          github-token: ${{ github.token }}

      - name: Restore executable modes
        run: |
          chmod 755 tool/release-tools
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            chmod 755 "dist/soloist-display-$target" "dist/soloist-audio-bridge-$target"
          done

      - name: Sign and test original release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          tool/release-tools build-manifest dist v1.0.0-alpha.3 1.0.0-alpha.3
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          openssl pkey -in "$key" -noout -check
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/release-manifest.json -out "$RUNNER_TEMP/release.sig"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/bootstrap-manifest.txt -out "$RUNNER_TEMP/bootstrap.sig"
          openssl base64 -A -in "$RUNNER_TEMP/release.sig" -out dist/release-manifest.sig
          openssl base64 -A -in "$RUNNER_TEMP/bootstrap.sig" -out dist/bootstrap-manifest.sig
          printf '\n' >> dist/release-manifest.sig
          printf '\n' >> dist/bootstrap-manifest.sig
          tool/release-tools render-bootstrap install.sh dist/bootstrap-manifest.txt "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.0-alpha.3" > dist/install.sh
          chmod 755 dist/install.sh
          sh -n dist/install.sh
          sh scripts/test-release-lifecycle.sh dist "$key"
          rm dist/soloist_release_*.tar.gz

      - name: Publish Alpha 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0-alpha.3 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'v1.0.0-alpha.3 already exists; refusing to overwrite it'
            exit 0
          fi
          gh release create v1.0.0-alpha.3 dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Soloist Display v1.0.0-alpha.3" --generate-notes --prerelease --latest=false
