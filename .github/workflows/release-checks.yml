name: Release checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --manifest-path audio-bridge/Cargo.toml
      - name: Rust release build
        run: cargo build --release --manifest-path audio-bridge/Cargo.toml
      - name: Architecture mapping (offline)
        run: |
          test "$(SOLOIST_TEST_MACHINE=x86_64 SOLOIST_TEST_BITS=64 bash packaging/install-soloist.sh --print-archive)" = x86_64
          test "$(SOLOIST_TEST_MACHINE=aarch64 SOLOIST_TEST_BITS=64 bash packaging/install-soloist.sh --print-archive)" = arm64
          test "$(SOLOIST_TEST_MACHINE=armv7l SOLOIST_TEST_BITS=32 bash packaging/install-soloist.sh --print-archive)" = arm32
          test "$(SOLOIST_TEST_MACHINE=aarch64 SOLOIST_TEST_BITS=32 bash packaging/install-soloist.sh --print-archive)" = arm32
          if SOLOIST_TEST_MACHINE=mips64 SOLOIST_TEST_BITS=64 bash packaging/install-soloist.sh --print-archive; then exit 1; fi
      - name: Shell syntax
        run: |
          sh -n packaging/soloist-display-launcher
          bash -n packaging/install-linux.sh
          bash -n packaging/install-soloist.sh
      - name: CLI help and invalid arguments
        run: |
          sh packaging/soloist-display-launcher --help | grep -q -- '--settings'
          if sh packaging/soloist-display-launcher --invalid; then exit 1; fi
      - name: JavaScript syntax
        run: |
          for file in src/*.js; do
            node --check --input-type=module < "$file"
          done

  arch-package:
    name: Arch package build and namcap
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git namcap sudo
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create unprivileged builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Validate PKGBUILD and build package
        run: |
          runuser -u builder -- bash -c 'cd "$1" && makepkg -s --noconfirm' bash "$GITHUB_WORKSPACE"
      - name: Verify AUR metadata
        run: |
          runuser -u builder -- bash -c 'cd "$1" && makepkg --printsrcinfo' bash "$GITHUB_WORKSPACE" > /tmp/soloist-display.SRCINFO
          sed -E '/^[[:space:]]*pkgver = /d' .SRCINFO > /tmp/soloist-display.committed.SRCINFO
          sed -E '/^[[:space:]]*pkgver = /d' /tmp/soloist-display.SRCINFO > /tmp/soloist-display.generated.normalized.SRCINFO
          diff -u /tmp/soloist-display.committed.SRCINFO /tmp/soloist-display.generated.normalized.SRCINFO
      - name: Analyze package with namcap
        run: |
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst
      - name: Install package and verify files
        run: |
          pacman -U --noconfirm ./*.pkg.tar.zst
          command -v soloist-display
          command -v soloist-audio-bridge
          soloist-display --help
          soloist-display --version
          test -f /usr/lib/systemd/user/soloist-display.service
          pacman -R --noconfirm soloist-display-git

  arm-build:
    name: ARM64 native / ARMv7 cross build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          targets: armv7-unknown-linux-gnueabihf
      - name: ARM64 tests and release build
        run: |
          cargo test --manifest-path audio-bridge/Cargo.toml
          cargo build --release --manifest-path audio-bridge/Cargo.toml
          file audio-bridge/target/release/soloist-audio-bridge
      - name: ARMv7 cross-compile
        run: |
          rustup target add armv7-unknown-linux-gnueabihf
          rustup target list --installed | grep -Fx armv7-unknown-linux-gnueabihf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc \
            cargo build --release --manifest-path audio-bridge/Cargo.toml --target armv7-unknown-linux-gnueabihf
          file audio-bridge/target/armv7-unknown-linux-gnueabihf/release/soloist-audio-bridge

