name: Release checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test --manifest-path audio-bridge/Cargo.toml
      - name: Rust release build
        run: cargo build --release --manifest-path audio-bridge/Cargo.toml
      - name: Shell syntax
        run: sh -n packaging/soloist-display-launcher
      - name: CLI help and invalid arguments
        run: |
          sh packaging/soloist-display-launcher --help | grep -q -- '--settings'
          if sh packaging/soloist-display-launcher --invalid; then exit 1; fi
      - name: JavaScript syntax
        run: |
          for file in src/*.js; do
            node --check --input-type=module < "$file"
          done

  arch-package:
    name: Arch package build and namcap
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git namcap sudo
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create unprivileged builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Validate PKGBUILD and build package
        run: |
          runuser -u builder -- bash -c 'cd "$1" && makepkg -s --noconfirm' bash "$GITHUB_WORKSPACE"
      - name: Verify AUR metadata
        run: |
          runuser -u builder -- bash -c 'cd "$1" && makepkg --printsrcinfo' bash "$GITHUB_WORKSPACE" > /tmp/soloist-display.SRCINFO
          sed -E '/^[[:space:]]*pkgver = /d' .SRCINFO > /tmp/soloist-display.committed.SRCINFO
          sed -E '/^[[:space:]]*pkgver = /d' /tmp/soloist-display.SRCINFO > /tmp/soloist-display.generated.normalized.SRCINFO
          diff -u /tmp/soloist-display.committed.SRCINFO /tmp/soloist-display.generated.normalized.SRCINFO
      - name: Analyze package with namcap
        run: |
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst
      - name: Install package and verify files
        run: |
          pacman -U --noconfirm ./*.pkg.tar.zst
          command -v soloist-display
          command -v soloist-audio-bridge
          soloist-display --help
          soloist-display --version
          test -f /usr/lib/systemd/user/soloist-display.service
          pacman -R --noconfirm soloist-display-git
