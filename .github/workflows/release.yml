name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - name: Validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo run --quiet -p soloist-display-installer --bin release-tools -- verify-workspace-version "$GITHUB_REF_NAME"
      - name: Validate tag syntax and release channels
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)\.[1-9][0-9]*)?$ ]]; then
            echo "Only stable, alpha.N and beta.N releases are allowed" >&2
            exit 1
          fi
          cargo run --quiet -p soloist-display-installer --bin release-tools -- validate-tag "$GITHUB_REF_NAME"
      - name: Build static executables
        run: |
          mkdir dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            cargo zigbuild --workspace --release --locked --target "$target"
            install -m755 "target/$target/release/soloist-display" "dist/soloist-display-$target"
            install -m755 "target/$target/release/soloist-audio-bridge" "dist/soloist-audio-bridge-$target"
          done
      - name: Validate current official Soloist archives
        run: |
          for arch in x86_64 arm64 arm32; do
            curl --fail --location --retry 3 --connect-timeout 10 --max-time 300 \
              "https://soloist-builds.spotifycdn.com/soloist_release_${arch}.tar.gz" \
              -o "dist/soloist_release_${arch}.tar.gz"
          done
          for arch in x86_64 arm64 arm32; do
            tar -xOf "dist/soloist_release_${arch}.tar.gz" soloist > "$RUNNER_TEMP/soloist-$arch"
          done
          file "$RUNNER_TEMP"/soloist-*
          file "$RUNNER_TEMP/soloist-x86_64" | grep -q 'x86-64'
          file "$RUNNER_TEMP/soloist-arm64" | grep -q 'ARM aarch64'
          file "$RUNNER_TEMP/soloist-arm32" | grep -q 'ARM.*EABI5'
          readelf -h "$RUNNER_TEMP/soloist-arm32" | grep -q 'hard-float ABI'
      - name: Save standalone release tool
        uses: actions/upload-artifact@v7
        with:
          name: release-tools
          path: target/x86_64-unknown-linux-musl/release/release-tools
          retention-days: 30
          if-no-files-found: error
      - name: Save unsigned release inputs
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-release
          path: dist/
          retention-days: 30
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Restore release tool
        uses: actions/download-artifact@v8
        with:
          name: release-tools
          path: tool/
      - run: chmod +x tool/release-tools
      - name: Restore unsigned release inputs
        uses: actions/download-artifact@v8
        with:
          name: unsigned-release
          path: dist/
      - name: Restore executable permissions
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            chmod 755 "dist/soloist-display-$target" "dist/soloist-audio-bridge-$target"
          done
      - name: Create and sign manifests
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          tool/release-tools build-manifest dist "$GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          openssl pkey -in "$key" -noout -check
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/release-manifest.json -out "$RUNNER_TEMP/release.sig"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/bootstrap-manifest.txt -out "$RUNNER_TEMP/bootstrap.sig"
          openssl base64 -A -in "$RUNNER_TEMP/release.sig" -out dist/release-manifest.sig
          openssl base64 -A -in "$RUNNER_TEMP/bootstrap.sig" -out dist/bootstrap-manifest.sig
          printf '\n' >> dist/release-manifest.sig
          printf '\n' >> dist/bootstrap-manifest.sig
          tool/release-tools render-bootstrap install.sh dist/bootstrap-manifest.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" > dist/install.sh
          chmod 755 dist/install.sh
          sh -n dist/install.sh
          sh scripts/test-release-lifecycle.sh dist "$key"
          rm dist/soloist_release_*.tar.gz
      - name: Save signed release assets
        uses: actions/upload-artifact@v7
        with:
          name: signed-release
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Restore signed release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-release
          path: dist/
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Soloist Display $GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"

  sync-stable:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Mint release app token
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Point stable at the published release commit
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin refs/heads/main refs/heads/stable
          release_tag="$(gh release view "$tag" --json tagName,isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')"
          test "$release_tag" = "$tag"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$tag" ]; then
            echo "$tag is not the latest published stable release ($latest); refusing to move stable" >&2
            exit 1
          fi
          sha="$(git rev-parse "$tag^{commit}")"
          test "$(git rev-parse HEAD)" = "$sha"
          test "$(git rev-parse "$sha^")" = "$(git ls-remote origin refs/heads/main | cut -f1)" || {
            echo "main has advanced since the release was prepared; confirming release ancestry instead"
            git merge-base --is-ancestor "$sha^" origin/main
          }
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- verify-workspace-version "$tag"
          old="$(git ls-remote origin refs/heads/stable | cut -f1)"
          test -n "$old"
          if [ "$old" = "$sha" ]; then
            echo "stable already matches $tag"
            exit 0
          fi
          # stable is an exact release pointer, not a merge history.
          # Its ruleset must grant this release bot bypass (including force updates).
          git push --force-with-lease="refs/heads/stable:$old" origin "$sha:refs/heads/stable"
          test "$(git ls-remote origin refs/heads/stable | cut -f1)" = "$sha"

  pages:
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
