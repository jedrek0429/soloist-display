name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: glibc-${{ matrix.target }}
      - name: Validate release version
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo run --quiet -p soloist-display-installer --bin release-tools -- verify-workspace-version "$GITHUB_REF_NAME"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)\.[1-9][0-9]*)?$ ]]; then
            echo "Only stable, alpha.N and beta.N releases are allowed" >&2
            exit 1
          fi
          cargo run --quiet -p soloist-display-installer --bin release-tools -- validate-tag "$GITHUB_REF_NAME"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@cargo-zigbuild
      - name: Build GNU executables and verify compatibility
        run: bash scripts/ci-build-glibc.sh ${{ matrix.target }}
      - name: Save unsigned release executables
        run: |
          mkdir -p dist
          target="${{ matrix.target }}"
          install -m755 "target/$target/release/soloist-display" "dist/soloist-display-$target"
          install -m755 "target/$target/release/soloist-audio-bridge" "dist/soloist-audio-bridge-$target"
      - name: Validate current official Soloist archives
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          for arch in x86_64 arm64 arm32; do
            curl --fail --location --retry 3 --connect-timeout 10 --max-time 300 \
              "https://soloist-builds.spotifycdn.com/soloist_release_${arch}.tar.gz" \
              -o "dist/soloist_release_${arch}.tar.gz"
          done
          for arch in x86_64 arm64 arm32; do
            tar -xOf "dist/soloist_release_${arch}.tar.gz" soloist > "$RUNNER_TEMP/soloist-$arch"
          done
          file "$RUNNER_TEMP"/soloist-*
          file "$RUNNER_TEMP/soloist-x86_64" | grep -q 'x86-64'
          file "$RUNNER_TEMP/soloist-arm64" | grep -q 'ARM aarch64'
          file "$RUNNER_TEMP/soloist-arm32" | grep -q 'ARM.*EABI5'
          readelf -h "$RUNNER_TEMP/soloist-arm32" | grep -q 'hard-float ABI'
      - name: Save standalone release tool
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: release-tools
          path: target/x86_64-unknown-linux-gnu/release/release-tools
          retention-days: 30
          if-no-files-found: error
      - name: Save unsigned assets
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.target }}
          path: dist/
          retention-days: 30
          if-no-files-found: error


  # Desktop previews are intentionally unsigned and are NOT part of the Linux
  # installer manifests. Build them from the release tag, not the alpha/beta head.
  desktop_windows:
    if: contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-windows
      - name: Build and test Windows preview
        run: |
          cargo test --locked -p soloist-audio-bridge
          cargo build --release --locked -p soloist-audio-bridge
      - name: Portable CLI smoke test
        shell: pwsh
        run: |
          target/release/soloist-audio-bridge.exe --help
          target/release/soloist-audio-bridge.exe --version
          target/release/soloist-audio-bridge.exe device list
          target/release/soloist-audio-bridge.exe device default
      - name: Package Windows preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist, out -Force | Out-Null
          Copy-Item target/release/soloist-audio-bridge.exe dist/soloist-display.exe
          Copy-Item docs/standalone-desktop.md dist/README.md
          Set-Content -Path dist/BUILD.txt -Value "tag=$env:GITHUB_REF_NAME", "commit=$env:GITHUB_SHA", "mode=external-only", "experimental=true"
      - name: Smoke test standalone HTTP server
        shell: pwsh
        run: |
          $env:SOLOIST_DISPLAY_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'soloist-standalone'
          $env:SOLOIST_DISPLAY_HTTP_PORT = '18080'
          $env:SOLOIST_DISPLAY_AUDIO_PORT = '19191'
          $proc = Start-Process -FilePath (Resolve-Path dist/soloist-display.exe) -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'display.stdout') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'display.stderr')
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18080/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Standalone HTTP server did not start' }
            $config = Invoke-RestMethod -Uri 'http://127.0.0.1:18080/config.json'
            if ($config.soloistWebSocket -ne 'ws://127.0.0.1:9090') { throw 'External Soloist default is wrong' }
            $settings = Invoke-WebRequest -Uri 'http://127.0.0.1:18080/settings'
            if ($settings.StatusCode -ne 200) { throw 'Settings page unavailable' }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            if (Test-Path (Join-Path $env:RUNNER_TEMP 'display.stderr')) {
              Get-Content (Join-Path $env:RUNNER_TEMP 'display.stderr')
            }
          }
      - name: Archive Windows preview
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "out/soloist-display-preview-windows-x86_64-$env:GITHUB_REF_NAME.zip"
      - name: Upload Windows preview for publishing
        uses: actions/upload-artifact@v7
        with:
          name: desktop-preview-windows
          path: out/*.zip
          retention-days: 30
          if-no-files-found: error

  desktop_macos:
    if: contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-macos-arm64
      - name: Build and test Apple Silicon preview
        run: |
          test "$(uname -m)" = arm64
          cargo test --locked -p soloist-audio-bridge
          cargo build --release --locked -p soloist-audio-bridge
      - name: Portable CLI smoke test
        run: |
          target/release/soloist-audio-bridge --help
          target/release/soloist-audio-bridge --version
          target/release/soloist-audio-bridge device list
          target/release/soloist-audio-bridge device default
      - name: Package Apple Silicon preview
        run: |
          mkdir -p dist out
          install -m755 target/release/soloist-audio-bridge dist/soloist-display
          cp docs/standalone-desktop.md dist/README.md
          printf 'tag=%s\ncommit=%s\nmode=external-only\nexperimental=true\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > dist/BUILD.txt
      - name: Smoke test standalone HTTP server
        env:
          SOLOIST_DISPLAY_CONFIG_DIR: ${{ runner.temp }}/soloist-standalone
          SOLOIST_DISPLAY_HTTP_PORT: '18080'
          SOLOIST_DISPLAY_AUDIO_PORT: '19191'
        run: |
          ./dist/soloist-display > /tmp/soloist-display.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; cat /tmp/soloist-display.log' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ -o /tmp/soloist-page.html; then break; fi
            sleep 0.5
          done
          test -s /tmp/soloist-page.html
          curl -fsS http://127.0.0.1:18080/config.json | grep -q 'soloistWebSocket'
          curl -fsS http://127.0.0.1:18080/settings | grep -q 'html'
      - name: Archive Apple Silicon preview (preserve executable bit)
        run: |
          (cd dist && zip -q "../out/soloist-display-preview-macos-arm64-$GITHUB_REF_NAME.zip" soloist-display README.md BUILD.txt)
          unzip -t "out/soloist-display-preview-macos-arm64-$GITHUB_REF_NAME.zip"
      - name: Upload Apple Silicon preview for publishing
        uses: actions/upload-artifact@v7
        with:
          name: desktop-preview-macos
          path: out/*.zip
          retention-days: 30
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Restore release tool
        uses: actions/download-artifact@v8
        with:
          name: release-tools
          path: tool/
      - run: chmod +x tool/release-tools
      - name: Restore unsigned release inputs
        uses: actions/download-artifact@v8
        with:
          pattern: unsigned-*-unknown-linux-gnu*
          path: dist/
          merge-multiple: true
      - name: Restore executable permissions
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf; do
            chmod 755 "dist/soloist-display-$target" "dist/soloist-audio-bridge-$target"
          done
      - name: Create and sign manifests
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          tool/release-tools build-manifest dist "$GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          openssl pkey -in "$key" -noout -check
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/release-manifest.json -out "$RUNNER_TEMP/release.sig"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/bootstrap-manifest.txt -out "$RUNNER_TEMP/bootstrap.sig"
          openssl base64 -A -in "$RUNNER_TEMP/release.sig" -out dist/release-manifest.sig
          openssl base64 -A -in "$RUNNER_TEMP/bootstrap.sig" -out dist/bootstrap-manifest.sig
          printf '\n' >> dist/release-manifest.sig
          printf '\n' >> dist/bootstrap-manifest.sig
          tool/release-tools render-bootstrap install.sh dist/bootstrap-manifest.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" > dist/install.sh
          chmod 755 dist/install.sh
          sh -n dist/install.sh
          sh scripts/test-release-lifecycle.sh dist "$key"
          rm dist/soloist_release_*.tar.gz
      - name: Save signed release assets
        uses: actions/upload-artifact@v7
        with:
          name: signed-release
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [sign, desktop_windows, desktop_macos]
    # For prereleases both desktop jobs are mandatory; for stable they must be
    # skipped. always() is needed because GitHub skips dependent jobs by default.
    if: >-
      always() && needs.sign.result == 'success' &&
      ((needs.desktop_windows.result == 'success' && needs.desktop_macos.result == 'success') ||
       (needs.desktop_windows.result == 'skipped' && needs.desktop_macos.result == 'skipped' &&
        !contains(github.ref_name, '-alpha.') && !contains(github.ref_name, '-beta.')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Restore signed release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-release
          path: dist/
      - name: Restore desktop previews for prereleases
        if: contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.')
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-preview-*
          path: dist/
          merge-multiple: true
      - name: Validate desktop previews match this release tag
        if: contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.')
        run: |
          for archive in "dist/soloist-display-preview-windows-x86_64-$GITHUB_REF_NAME.zip" "dist/soloist-display-preview-macos-arm64-$GITHUB_REF_NAME.zip"; do
            test -s "$archive"
            unzip -t "$archive" >/dev/null
            unzip -p "$archive" BUILD.txt | tr -d '\r' | grep -Fx "tag=$GITHUB_REF_NAME"
            unzip -p "$archive" BUILD.txt | tr -d '\r' | grep -Fx "commit=$GITHUB_SHA"
          done
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's implicit baseline ignores prerelease channel sequencing.
          # Only already-published releases are eligible, not draft/unused tags.
          previous="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' \
            | cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- release-notes-base "$GITHUB_REF_NAME")"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
              | cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- \
                validate-prerelease-floor "$GITHUB_REF_NAME"
          fi
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Soloist Display $GITHUB_REF_NAME" --generate-notes)
          if [[ -n "$previous" ]]; then
            echo "Release notes baseline: $previous -> $GITHUB_REF_NAME"
            args+=(--notes-start-tag "$previous")
          else
            echo "No earlier published baseline; generating initial release notes"
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"

  sync-stable:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Mint release app token
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Point stable at the published release commit
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin refs/heads/main refs/heads/stable
          release_tag="$(gh release view "$tag" --json tagName,isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')"
          test "$release_tag" = "$tag"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$tag" ]; then
            echo "$tag is not the latest published stable release ($latest); refusing to move stable" >&2
            exit 1
          fi
          sha="$(git rev-parse "$tag^{commit}")"
          test "$(git rev-parse HEAD)" = "$sha"
          test "$(git rev-parse "$sha^")" = "$(git ls-remote origin refs/heads/main | cut -f1)" || {
            echo "main has advanced since the release was prepared; confirming release ancestry instead"
            git merge-base --is-ancestor "$sha^" origin/main
          }
          cargo run --quiet --locked -p soloist-display-installer --bin release-tools -- verify-workspace-version "$tag"
          old="$(git ls-remote origin refs/heads/stable | cut -f1)"
          test -n "$old"
          if [ "$old" = "$sha" ]; then
            echo "stable already matches $tag"
            exit 0
          fi
          # stable is an exact release pointer, not a merge history.
          # Its ruleset must grant this release bot bypass (including force updates).
          git push --force-with-lease="refs/heads/stable:$old" origin "$sha:refs/heads/stable"
          test "$(git ls-remote origin refs/heads/stable | cut -f1)" = "$sha"


  pages:
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
