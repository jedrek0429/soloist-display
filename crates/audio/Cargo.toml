[package]
name = "soloist-audio-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform CPAL system-output capture and six-band FFT bridge"

[dependencies]
soloist-cli = { path = "../cli" }
soloist-engine = { path = "../core" }
soloist-platform = { path = "../platform" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "=4.6.11"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
rustfft = "6"
axum = "0.7"
serde_json = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", features = ["pulseaudio"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
soloist-display-installer = { path = "../installer" }
cpal = "=0.18.2"
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"



[dev-dependencies]
tempfile = "3"
