<!doctype html>
<html lang="en" data-display-state="ready" data-idle-appearance="digital-clock" data-idle-show-date="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soloist Display — Idle preview</title>
<link rel="stylesheet" href="../styles.css">
<style>
.preview-controls{position:fixed;top:16px;right:16px;z-index:20;width:min(320px,calc(100vw - 32px));padding:18px;background:#111e;border:1px solid #666a;border-radius:8px;backdrop-filter:blur(15px);box-shadow:0 10px 35px #0006;font:14px/1.4 system-ui,sans-serif;color:#fff}
.preview-controls[hidden]{display:none}
.preview-controls h2{font-size:14px;font-weight:600;margin:0 0 12px}
.preview-controls label{display:block;margin:10px 0}
.preview-controls select,.preview-controls input[type=text]{width:100%;padding:7px;margin-top:4px;border:1px solid #777;border-radius:4px;background:#252525;color:#fff;font:inherit}
.preview-controls input[type=checkbox]{accent-color:#ddd}
.preview-controls button{margin-top:8px;padding:7px 10px;border:1px solid #aaa;border-radius:4px;background:transparent;color:#fff;cursor:pointer}
.preview-controls button:focus-visible,.preview-controls select:focus-visible,.preview-controls input:focus-visible{outline:2px solid white;outline-offset:3px}
.preview-hint{font-size:12px;color:#bbb;margin:12px 0 0}
</style>
</head>
<body>
<main class="stage" aria-label="Idle preview">
<section class="standby" id="standby" aria-label="Standby screen">
<div class="standby-content">
<div class="standby-clock-group"><time class="standby-clock" id="standby-clock">--:--</time></div>
<div class="standby-record" id="standby-record" aria-hidden="true"><div class="standby-label">S</div><span class="standby-hand standby-hour"></span><span class="standby-hand standby-minute"></span><span class="standby-hand standby-second"></span><span class="standby-pin"></span></div>
<p class="standby-date" id="standby-date"></p>
<h1 class="standby-caption" id="standby-title">Ready when you are</h1>
<div class="standby-indicator" role="status"><span class="standby-light" aria-hidden="true"></span><span id="standby-status">CONNECTING</span></div>
<p id="standby-description">Connecting to Soloist…</p>
</div>
</section>
</main>
<aside class="preview-controls" id="preview-controls" aria-label="Preview controls">
<h2>Idle preview — PR #77</h2>
<label>Appearance
<select id="appearance">
<option value="digital-clock">Digital clock</option>
<option value="vinyl-clock">Vinyl clock</option>
<option value="vinyl">Vinyl standby</option>
<option value="text">Text only</option>
<option value="black">Pure black</option>
</select>
</label>
<label>Connection state
<select id="connection">
<option value="ready">Ready</option>
<option value="paused">Paused</option>
<option value="connecting">Connecting</option>
<option value="offline">Disconnected</option>
</select>
</label>
<label>Custom message
<input id="caption" type="text" maxlength="80" value="Ready when you are">
</label>
<label><input id="date" type="checkbox" checked> Show date</label>
<button type="button" id="hide">Hide controls</button>
<p class="preview-hint">Press P to show or hide controls. This is the actual standby markup and stylesheet from the PR. It does not connect to Spotify.</p>
</aside>
<script>
const $=id=>document.getElementById(id);
const root=document.documentElement;
const copy={
  ready:['READY','Play something on Spotify to begin.'],
  paused:['PAUSED','Playback is paused.'],
  connecting:['CONNECTING','Checking playback status…'],
  offline:['RECONNECTING','Connection lost. Trying again automatically…']
};
function render(){
  root.dataset.idleAppearance=$('appearance').value;
  root.dataset.idleShowDate=$('date').checked?'true':'false';
  root.dataset.displayState=$('connection').value;
  $('standby-title').textContent=$('caption').value;
  const [status,description]=copy[$('connection').value];
  $('standby-status').textContent=status;
  $('standby-description').textContent=description;
}
function clock(){
  const now=new Date();
  $('standby-clock').textContent=now.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  $('standby-date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const hour=(now.getHours()%12)+now.getMinutes()/60+now.getSeconds()/3600;
  const minute=now.getMinutes()+now.getSeconds()/60;
  $('standby-record').style.setProperty('--standby-hour-angle',hour*30+'deg');
  $('standby-record').style.setProperty('--standby-minute-angle',minute*6+'deg');
  $('standby-record').style.setProperty('--standby-second-angle',now.getSeconds()*6+'deg');
}
for(const id of ['appearance','connection','caption','date'])$(id).addEventListener('input',render);
function toggleControls(){$('preview-controls').hidden=!$('preview-controls').hidden}
$('hide').addEventListener('click',toggleControls);
window.addEventListener('keydown',event=>{
  if(event.key.toLowerCase()!=='p'||event.ctrlKey||event.altKey||event.metaKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
  toggleControls();
});
render();
clock();
setInterval(clock,1000);
</script>
</body>
</html>
