<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<meta name="description" content="A full-screen now-playing display for Spotify Soloist.">
<title>Soloist Display</title>
<style>
:root{color-scheme:dark;font:15px Arial,Helvetica,sans-serif;background:#101010;color:#f2f2f2;--ink:#f2f2f2;--bg:#101010;--line:#555}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg)}
main{width:min(760px,calc(100% - 40px));min-width:0;height:100vh;height:100dvh;margin:auto;padding:max(28px,env(safe-area-inset-top)) 0 max(24px,env(safe-area-inset-bottom));display:grid;grid-template-rows:1fr auto auto}
.hero{align-self:center;padding:24px 0}
h1{font-size:clamp(42px,8vw,76px);font-weight:600;line-height:.95;letter-spacing:-.055em;margin:0 0 24px}
p{color:#aaa;margin:0;max-width:700px;font-size:clamp(19px,3vw,28px);line-height:1.25;letter-spacing:-.02em}
.install{min-width:0;padding-bottom:22px}
.label{display:block;font-size:12px;color:#aaa;margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em}
.command{display:flex;min-width:0;border:1px solid var(--line)}
code{min-width:0;padding:16px;overflow:auto;white-space:nowrap;flex:1;color:var(--ink)}
button,a{font:inherit;color:var(--ink);background:transparent;border:0;text-decoration:none;cursor:pointer}
button{border-left:1px solid var(--line);padding:0 18px}
button:hover,button:focus-visible,a:hover,a:focus-visible{background:var(--ink);color:var(--bg);outline:0}
footer{display:flex;gap:18px;border-top:1px solid var(--line);padding-top:18px;font-size:13px}
[hidden]{display:none}
@media(max-width:560px){main{width:calc(100% - 40px)}.command{display:block}button{width:100%;border-left:0;border-top:1px solid var(--line);padding:12px}code{display:block;padding:13px}}
</style>
</head>
<body>
<main>
<section class="hero"><h1>Soloist Display.</h1><p>Turn any device into a Spotify Connect speaker with a beautiful display.</p></section>
<section class="install" id="install" hidden>
<span class="label">Install</span>
<div class="command"><code id="command">curl -fsSL https://jedrek0429.github.io/soloist-display/install.sh | sh</code><button id="copy" type="button">Copy</button></div>
</section>
<footer><a href="https://github.com/jedrek0429/soloist-display">GitHub</a><a href="https://developer.spotify.com/documentation/soloist">Soloist</a></footer>
</main>
<script>
const command=document.querySelector('#command').textContent;
fetch('https://api.github.com/repos/jedrek0429/soloist-display/releases/latest',{headers:{Accept:'application/vnd.github+json'}}).then(response=>{
  if(!response.ok)throw new Error();
  document.querySelector('#install').hidden=false;
}).catch(()=>{});
document.querySelector('#copy').addEventListener('click',async event=>{
  await navigator.clipboard.writeText(command);
  event.currentTarget.textContent='Copied';
});
</script>
</body>
</html>
