<!doctype html>
<html lang="en" data-display-state="connecting"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Soloist Display</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="stage" id="stage" aria-label="Now playing">
<section class="standby" id="standby" aria-label="Soloist connection status">
<div class="standby-content">
<div class="standby-brand">SOLOIST <span>DISPLAY</span></div>
<div class="standby-record" aria-hidden="true"><div class="standby-label">S</div></div>
<div class="standby-indicator" role="status"><span class="standby-light" aria-hidden="true"></span><span id="standby-status">CONNECTING</span></div>
<h1 id="standby-title">Connecting to Soloist</h1>
<p id="standby-description">Checking playback status…</p>
</div>
</section>
<div class="backdrop" aria-hidden="true"><div class="backdrop-image" id="backdrop-a"></div><div class="backdrop-image" id="backdrop-b"></div><div class="backdrop-shade"></div></div>
<div class="disc-stage" id="disc-stage" aria-label="Album artwork"><div class="disc" id="disc-a"><div class="record-track"><div class="rotor"><div class="disc-image"></div><div class="disc-label"></div><div class="spindle"></div></div></div><div class="record-sleeve"></div></div><div class="disc" id="disc-b"><div class="record-track"><div class="rotor"><div class="disc-image"></div><div class="disc-label"></div><div class="spindle"></div></div></div><div class="record-sleeve"></div></div></div>
<section class="info" id="info" aria-live="polite"><div class="info-header"><canvas id="visualizer" aria-label="Live audio spectrum"></canvas></div><div class="info-copy"><h1 id="track">Not playing</h1><p id="artist">Waiting for Soloist</p></div><div class="progress" id="progress" role="progressbar" aria-label="Track progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div><div class="track-times" id="track-times"><span id="time-elapsed">0:00</span><span class="time-separator"> / </span><span id="time-end">0:00</span></div></section>
</main><script type="module" src="./src/main.js"></script></body></html>
