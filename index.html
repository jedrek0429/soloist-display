<!doctype html>
<html lang="en" data-display-state="connecting" data-initializing="true" data-metadata-ready="false"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Soloist Display</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="stage" id="stage" aria-label="Now playing">
<section class="standby" id="standby" aria-label="Standby screen">
<div class="standby-content">
<div class="standby-clock-group"><time class="standby-clock" id="standby-clock">--:--</time></div>
<div class="standby-record" id="standby-record" aria-hidden="true"><div class="standby-label"></div><span class="standby-hand standby-hour"></span><span class="standby-hand standby-minute"></span></div>
<p class="standby-date" id="standby-date"></p>
<h1 class="standby-caption" id="standby-title"></h1>
</div>
<p class="standby-connection" id="standby-connection" role="status" aria-live="polite"></p>
</section>
<div class="backdrop" aria-hidden="true"><div class="backdrop-image" id="backdrop-a"></div><div class="backdrop-image" id="backdrop-b"></div><div class="backdrop-shade"></div></div>
<div class="disc-stage" id="disc-stage" aria-label="Album artwork"><div class="disc" id="disc-a"><div class="record-track"><div class="rotor"><div class="disc-image"></div><div class="disc-label"></div><div class="spindle"></div></div></div><div class="record-sleeve"></div></div><div class="disc" id="disc-b"><div class="record-track"><div class="rotor"><div class="disc-image"></div><div class="disc-label"></div><div class="spindle"></div></div></div><div class="record-sleeve"></div></div></div>
<section class="info" id="info" aria-live="polite"><div class="info-header"><canvas id="visualizer" aria-label="Live audio spectrum"></canvas></div><div class="info-copy"><h1 id="track"></h1><p id="artist"></p></div><div class="progress" id="progress" role="progressbar" aria-label="Track progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div><div class="track-times" id="track-times"><span id="time-elapsed">0:00</span><span class="time-separator"> / </span><span id="time-end">0:00</span></div></section>
</main><script type="module" src="./src/main.js"></script></body></html>
