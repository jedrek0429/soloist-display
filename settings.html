<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <title>Soloist Display Settings</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      background: #11110f;
      color: #f4f1e8;
      --paper: #f4f1e8;
      --muted: #96938a;
      --line: #32312c;
      --panel: #1a1a17;
      --accent: #d9cba6;
    }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; background: radial-gradient(circle at 85% 0, #24231d 0, #11110f 34%); }
    button, input, a { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .shell { width: min(1120px, 100%); min-width: 0; min-height: 100dvh; margin: 0 auto; padding: 28px 34px; display: grid; grid-template-rows: auto 1fr auto; gap: 24px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .eyebrow { margin: 0 0 7px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(27px, 3.3vw, 40px); line-height: 1; letter-spacing: -.035em; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .button { border: 1px solid var(--line); border-radius: 999px; padding: 11px 17px; background: #24231f; color: var(--paper); text-decoration: none; font-weight: 650; cursor: pointer; }
    .button:hover { border-color: #545149; background: #2b2a25; }
    .workspace { min-height: 0; display: grid; grid-template-columns: 240px minmax(0, 1fr); overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: rgba(20,20,17,.82); box-shadow: 0 22px 70px rgba(0,0,0,.25); }
    .section-nav { padding: 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
    .nav-label { margin: 3px 10px 10px; color: #77746c; font-size: 10px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
    .nav-button { width: 100%; border: 0; border-radius: 10px; padding: 12px 13px; display: flex; align-items: center; gap: 11px; background: transparent; color: #aaa79f; text-align: left; cursor: pointer; }
    .nav-button:hover { background: #22221e; color: var(--paper); }
    .nav-button[aria-current="page"] { background: var(--paper); color: #171713; }
    .nav-index { width: 19px; font-size: 11px; font-variant-numeric: tabular-nums; opacity: .62; }
    .nav-title { font-size: 14px; font-weight: 680; }
    .panel { min-width: 0; padding: 27px 32px 24px; }
    .panel-header { padding-bottom: 19px; border-bottom: 1px solid var(--line); }
    .panel-kicker { margin: 0 0 7px; color: var(--accent); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
    h2 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
    .panel-description { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    #controls { padding-top: 8px; }
    .field { min-height: 58px; display: grid; grid-template-columns: minmax(165px, .8fr) minmax(180px, 1.5fr) 64px; align-items: center; gap: 18px; border-bottom: 1px solid #292824; }
    .field:last-child { border-bottom: 0; }
    .field-label { color: #dedbd2; font-size: 14px; }
    .field output { justify-self: end; min-width: 50px; padding: 5px 8px; border-radius: 6px; background: #24231f; color: #bbb7ad; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; height: 4px; accent-color: var(--accent); cursor: pointer; }
    input[type="text"] { width: 100%; min-width: 0; border: 1px solid #424039; border-radius: 8px; padding: 9px 11px; background: #121210; color: var(--paper); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; outline: none; }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(217,203,166,.12); }
    .switch { justify-self: start; position: relative; width: 42px; height: 24px; cursor: pointer; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch-track { position: absolute; inset: 0; border-radius: 999px; background: #35342f; transition: background .18s ease; }
    .switch-track::after { content: ""; position: absolute; top: 4px; left: 4px; width: 16px; height: 16px; border-radius: 50%; background: #8b8982; transition: transform .18s ease, background .18s ease; }
    .switch input:checked + .switch-track { background: var(--accent); }
    .switch input:checked + .switch-track::after { transform: translateX(18px); background: #171713; }
    .switch input:focus-visible + .switch-track { outline: 2px solid var(--paper); outline-offset: 3px; }
    .footer { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    #status { margin: 0; color: #a9b69a; font-size: 13px; }
    .actions { display: flex; gap: 9px; }
    .actions button { border: 1px solid var(--line); border-radius: 9px; padding: 10px 15px; font-weight: 680; cursor: pointer; }
    #reset { background: transparent; color: #aaa79f; }
    #reset:hover { color: var(--paper); border-color: #555249; }
    #save { border-color: var(--accent); background: var(--accent); color: #171713; }
    #save:hover { background: #eadfbe; }
    @media (max-width: 720px) {
      .shell { padding: 20px 16px; gap: 18px; }
      .topbar { gap: 12px; }
      .topbar > div { min-width: 0; }
      .topbar .button { flex: 0 0 auto; padding: 9px 12px; font-size: 13px; white-space: nowrap; }
      .workspace { width: 100%; min-width: 0; display: block; overflow: hidden; }
      .section-nav { width: 100%; min-width: 0; border: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; }
      .nav-label, .nav-index { display: none; }
      .nav-button { flex: 0 0 auto; width: auto; padding: 10px 12px; }
      .panel { padding: 23px 20px; }
      .field { grid-template-columns: 1fr auto; gap: 9px 16px; padding: 12px 0; }
      .field input[type="range"], .field input[type="text"] { grid-column: 1 / -1; grid-row: 2; }
      .switch { grid-column: 2; grid-row: 1; }
      .field output { grid-column: 2; grid-row: 1; }
      .field:has(.switch) output { display: none; }
      .footer { align-items: flex-start; flex-direction: column; }
      .actions { width: 100%; }
      .actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Control room</p>
        <h1>Soloist Display</h1>
        <p class="subtitle">Tune the screen without interrupting playback.</p>
      </div>
      <a class="button" href="/">Open display</a>
    </header>

    <div class="workspace">
      <nav class="section-nav" id="section-nav" aria-label="Settings categories">
        <p class="nav-label">Settings</p>
      </nav>
      <main class="panel">
        <header class="panel-header">
          <p class="panel-kicker" id="panel-kicker"></p>
          <h2 id="panel-title"></h2>
          <p class="panel-description" id="panel-description"></p>
        </header>
        <div id="controls"></div>
      </main>
    </div>

    <footer class="footer">
      <p id="status" role="status" aria-live="polite">Changes stay local to this display.</p>
      <div class="actions">
        <button id="reset" type="button">Reset defaults</button>
        <button id="save" type="button">Save changes</button>
      </div>
    </footer>
  </div>
  <script type="module" src="/src/settings.js"></script>
</body>
</html>
