<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soloist Display Settings</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#151515;color:#eee}body{max-width:850px;margin:4vh auto;padding:0 24px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:32px}h2{font-size:18px;margin:0 0 18px}section{background:#222;border:1px solid #393939;border-radius:16px;padding:24px;margin:20px 0}.field{display:grid;grid-template-columns:minmax(170px,1fr) minmax(150px,2fr) 70px;align-items:center;gap:15px;margin:15px 0}.field output{text-align:right;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#d9cba6}input[type=text]{width:100%;padding:10px;border:1px solid #666;background:#181818;color:white;border-radius:8px}button,a.button{background:#d9cba6;color:#121212;border:0;padding:12px 16px;border-radius:9px;cursor:pointer;text-decoration:none;font-weight:600}button.secondary,a.secondary{background:#383838;color:#eee}.actions{display:flex;gap:12px;flex-wrap:wrap}#status{min-height:24px;color:#c6d8ad}details{margin:20px 0}label{cursor:pointer}@media(max-width:600px){.field{grid-template-columns:1fr auto}.field input[type=range],.field input[type=text]{grid-column:1/-1;grid-row:2}}</style></head>
<body><header><div><h1>Soloist Display</h1><p>Appearance and playback settings</p></div><a class="button secondary" href="/">Open display</a></header><main id="controls"></main><div class="actions"><button id="save">Save settings</button><button id="reset" class="secondary">Reset to defaults</button></div><p id="status" role="status"></p><script type="module" src="/src/settings.js"></script></body></html>
