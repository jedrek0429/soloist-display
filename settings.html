<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Soloist Display — Settings</title>
<style>
:root{color-scheme:dark;font:15px Arial,Helvetica,sans-serif;background:#101010;color:#f2f2f2;--ink:#f2f2f2;--bg:#101010;--line:#555}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg)}
button,input,select,a{font:inherit}
button,select,input[type=text]{border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink)}
button,a{cursor:pointer}
button:hover,a:hover{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.shell{max-width:960px;margin:auto;padding:28px 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}
h1{font-size:26px;font-weight:600;letter-spacing:-.03em;margin:0}
.button{border:1px solid var(--line);padding:9px 14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.workspace{display:grid;grid-template-columns:185px minmax(0,1fr);gap:35px;padding-top:30px}
.section-nav{display:flex;flex-direction:column;align-items:stretch;gap:3px}
.nav-button{text-align:left;padding:12px;border:0;border-left:2px solid transparent;background:transparent;color:var(--ink)}
.nav-button[aria-current=page]{border-left-color:var(--ink);font-weight:bold}
.nav-group{display:flex;flex-direction:column;min-width:0}
.nav-group-toggle{display:flex;align-items:center;justify-content:space-between;width:100%}
.nav-group-toggle:after{content:'⌄';font-size:16px;transform:rotate(-90deg);transition:transform .15s}
.nav-group-toggle[aria-expanded=true]:after{transform:rotate(0)}
.nav-subnav{display:flex;flex-direction:column;padding-left:14px}
.nav-subnav[hidden]{display:none}
.nav-subbutton{font-size:14px;padding:9px 12px;color:#bfbfbf}
.nav-subbutton[aria-current=page]{color:var(--ink)}
.panel{min-width:0}
.panel-header{display:none}
.field[hidden]{display:none}.field{display:grid;grid-template-columns:minmax(130px,1fr) minmax(170px,1.3fr) 65px;align-items:center;gap:15px;min-height:57px;border-bottom:0}
.field-label{font-size:14px}
.field input[type=range]{width:100%;accent-color:var(--ink)}
.field input[type=text],.field select{min-width:0;width:100%;padding:8px}
.field select:disabled{opacity:.4;cursor:not-allowed}.link-button{padding:6px 12px;justify-self:start;font-size:13px}.link-button[aria-pressed=true]{background:var(--ink);color:var(--bg)}.transition-disc{border-bottom:0}.linked-field{min-height:35px;border-bottom:0}.linked-field .field-label{font-size:12px;color:#aaa}.transition-backdrop{border-top:0}.field output{text-align:right;font:13px Arial,Helvetica,sans-serif}
.field:has(.switch) output{display:none}
.switch{justify-self:start;position:relative;width:42px;height:22px;cursor:pointer;border:1px solid var(--ink)}
.switch input{position:absolute;opacity:0}
.switch-track{display:block;width:100%;height:100%;position:relative}
.switch-track:after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;background:var(--ink);transition:transform .12s}
.switch input:checked+.switch-track{background:var(--ink)}
.switch input:checked+.switch-track:after{background:var(--bg);transform:translateX(19px)}
.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:20px;margin-top:32px}
#status{font-size:13px;margin:0}
.actions{display:flex;gap:10px}
.actions button{padding:10px 15px}
#save{background:var(--ink);color:var(--bg)}
#save:hover{background:var(--bg);color:var(--ink)}
@media(max-width:650px){.shell{padding:20px 16px}.workspace{display:block;padding-top:14px}.section-nav{flex-direction:row;align-items:flex-start;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.nav-group{flex:none}.nav-subnav{padding-left:0}.nav-subbutton{font-size:13px;padding:8px 12px}.nav-button{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}.nav-button[aria-current=page]{border-bottom-color:var(--ink)}.field{grid-template-columns:1fr auto;gap:8px 12px;padding:12px 0}.field input[type=range],.field input[type=text],.field select{grid-column:1/-1;grid-row:2}.field output{grid-column:2;grid-row:1}.footer{align-items:stretch;flex-direction:column}.actions button{flex:1}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><h1>Soloist Display</h1><a class="button" href="/">Display</a></header>
<div class="workspace">
<nav class="section-nav" id="section-nav" aria-label="Settings categories"></nav>
<main class="panel"><header class="panel-header"><span id="panel-kicker"></span><h2 id="panel-title"></h2><p id="panel-description"></p></header><div id="controls"></div></main>
</div>
<footer class="footer"><p id="status" role="status" aria-live="polite"></p><div class="actions"><button id="reset" type="button">Reset</button><button id="save" type="button">Save</button></div></footer>
</div>
<script type="module" src="/src/settings.js"></script>
</body>
</html>
